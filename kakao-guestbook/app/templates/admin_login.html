{% extends "layout.html" %}
{% block title %}관리자 로그인 · {{ settings.app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1 class="center">관리자 로그인</h1>
  {% if settings.admin_login_enabled %}
    <form method="post" action="/auth/admin/login" class="stack">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button class="btn primary block">로그인</button>
    </form>
  {% else %}
    <div class="flash error">기본 관리자 계정이 비활성화되어 있습니다. <code>.env</code>의 <code>ADMIN_USERNAME</code>/<code>ADMIN_PASSWORD</code>를 설정하세요.</div>
  {% endif %}
  <p class="center small"><a href="/login">← 카카오 로그인으로</a></p>
</section>
{% endblock %}

server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # /auth/** → Eureka 에 등록된 AUTH-SERVICE 로 로드밸런싱
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        # /boards, /boards/** → Eureka 에 등록된 BOARD-SERVICE 로 로드밸런싱
        - id: board-service
          uri: lb://BOARD-SERVICE
          predicates:
            - Path=/boards/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway
